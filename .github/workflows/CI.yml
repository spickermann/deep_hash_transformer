name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']

    name: CI Ruby ${{ matrix.ruby }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Tests and Standard
        run: bundle exec rake
      - name: Build and Verify Isolated Package
        run: ruby script/verify_package.rb
      - name: Codacy Coverage
        if: ${{ matrix.ruby == '4.0' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
